<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario Académico</title>
  <link rel="stylesheet" href="/scss/main.css" />
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <h1>Calendario Académico</h1>
    <div>
      <button id="btn-mode" class="btn-ghost">📝 Modo personal</button>
      <button id="btn-config" class="btn-ghost">⚙️ Semestre</button>
      <button id="btn-theme" class="btn-ghost">Modo oscuro</button>
      <button id="btn-new-event" class="btn-primary">+ Nuevo evento</button>
    </div>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <div id="app-layout">

    <!-- Sidebar izquierdo: filtros -->
    <aside id="sidebar-left">
      <section>
        <h2>Filtrar por tipo</h2>
        <div id="filter-type"></div>
      </section>
      <section>
        <h2 id="sidebar-course-label">Filtrar por curso</h2>
        <div id="filter-course"></div>
      </section>
    </aside>

    <!-- Calendario central -->
    <main id="calendar-main">

      <div id="calendar-nav">
        <h2 id="calendar-title"></h2>
        <div class="nav-buttons">
          <button id="btn-prev" class="btn-ghost">&#8249;</button>
          <button id="btn-next" class="btn-ghost">&#8250;</button>
        </div>
      </div>

      <div id="calendar-carousel">
        <div id="calendar-grid"></div>
        <div id="calendar-grid-next"></div>
      </div>

    </main>

    <!-- Sidebar derecho: próximos eventos -->
    <aside id="sidebar-right">
      <h2>Próximos eventos</h2>
      <ul id="upcoming-list"></ul>
    </aside>

  </div>

  <!-- MODAL configuración del semestre -->
  <div id="config-overlay" class="modal-overlay hidden">
    <div class="modal" id="config-modal">
      <div class="modal-header">
        <h3>Configurar semestre</h3>
        <button id="config-close" class="btn-ghost">✕</button>
      </div>
      <form id="config-form">
        <label for="config-start">Fecha de inicio del semestre</label>
        <input type="date" id="config-start" name="start" required />

        <label for="config-weeks">Total de semanas</label>
        <input type="number" id="config-weeks" name="weeks" min="1" max="52" value="16" required />

        <button type="submit" class="btn-primary">Guardar</button>
      </form>
    </div>
  </div>

  <!-- MODAL crear/editar evento -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3>Nuevo evento</h3>
        <button id="modal-close" class="btn-ghost">✕</button>
      </div>
      <form id="event-form">

        <label for="event-title">Título</label>
        <input type="text" id="event-title" name="title" placeholder="Ej: Examen parcial" required />

        <label for="event-description">Descripción</label>
        <textarea id="event-description" name="description" placeholder="Notas opcionales"></textarea>

        <label for="event-type">Tipo</label>
        <select id="event-type" name="type">
          <option value="task">Tarea</option>
          <option value="exam">Examen</option>
          <option value="other">Otro</option>
        </select>

        <label for="event-course">Curso</label>
        <select id="event-course" name="courseId">
          <option value="">Sin curso</option>
        </select>

        <label for="event-date">Fecha</label>
        <input type="date" id="event-date" name="date" required />

        <label for="event-color">Color</label>
        <input type="color" id="event-color" name="color" value="#5B7FFF" />

        <div class="modal-actions">
          <button type="button" id="btn-delete-event" class="btn-danger" style="display:none">Eliminar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>

      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
